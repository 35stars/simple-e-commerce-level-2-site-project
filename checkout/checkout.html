<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Checkout Summary</title>

	<style>
		body {

			display: flex;
			justify-content: center;
			align-items: center;

			font-family: Arial, sans-serif;

			background: #fefefe;
	
			text-align: center;
			overflow-y: hidden;
			height: 100vh;
		}

		.summary {
			display: inline-block;
			border: 1px solid #ccc;
			padding: 30px;
			border-radius: 10px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
			background: #fff;
		}

		h1 {
			color: #28a745;
		}

		p {
			font-size: 18px;
			margin: 10px 0;
		}

		.btn {
			margin-top: 20px;
			padding: 10px 20px;
			font-size: 1rem;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			font-weight: bold;
			color: white;
			transition: transform .3s ease;
		}

		#image-el {
			width: 150px;
		}

		.btn:hover {
			transform: scale(1.02);
		}

		.pay-btn {
			background: #28a745;
		}

		.back-btn {
			background: #007bff;
		}

		#btn-div {
			display: flex;
			gap: 10px;
			justify-content: space-evenly;
		}

		#back-to-home {
			cursor: pointer;
			background: rgba(0, 0, 0, .8);
			border-style: none;
			padding: .5rem;
			font-weight: bold;
			color: white;
			position: fixed;
			top: 0;
			left: 0;
			margin: 1rem;
		}
	</style>
</head>
<body>

	<button id="back-to-home">Back to Home</button>
	<div class="summary">
		<h1>Checkout Summary</h1>
		<img src="" id="image-el">
		<p><strong>Print Name: </strong><span id="caption"></span></p>
		<p><strong>Quantity: </strong><span id="quantity"></span></p>
		<p><strong>Total Price: </strong>$<span id="total">0</span></p>

		<div id="btn-div">
			<button class="btn back-btn" id="back-btn">Back</button>
			<button class="btn pay-btn" id="pay-btn">Proceed to Payment</button>
		</div>
	</div>
	<script src="checkout.js"></script>
</body>
</html>
